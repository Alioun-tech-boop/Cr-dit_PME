name: Validation PDF LaTeX

on:
  pull_request:
    branches: [main]
    paths:
      - "credit/printing/**"
      - "credit/security/worker.py"
      - "tests/test_printing.py"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pdf-latex-validation.yml"
  push:
    branches: [feature/latex-premium-pdf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TeX Live and OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-fra \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-lang-french lmodern

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run PDF rendering and access-control tests
        run: uv run pytest tests/test_printing.py -q

      - name: Build production Docker image
        run: docker build --pull -t credix-latex-validation .
